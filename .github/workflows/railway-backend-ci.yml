name: Railway backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/railway-backend-ci.yml"
  push:
    branches:
      - "codex/railway-backend"
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/railway-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run build

      - name: Type-check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build Railway container
        run: docker build --tag autoparts-backend:ci .

      - name: Verify forecasting runtime
        run: >-
          docker run --rm autoparts-backend:ci
          python -c "import numpy, pandas, scipy, sklearn, statsmodels, xgboost; print('forecast runtime ok')"
